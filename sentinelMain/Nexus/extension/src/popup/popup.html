<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXUS Contextual Intelligence</title>
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
    }
    .header {
      font-size: 11px;
      font-weight: 700;
      color: #818cf8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 12px;
    }
    .status-card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 6px;
    }
    .status-row:last-child {
      margin-bottom: 0;
    }
    .label {
      color: #94a3b8;
    }
    .value {
      font-weight: 600;
      color: #34d399;
    }
    .btn {
      width: 100%;
      padding: 8px 12px;
      background-color: #4f46e5;
      color: #ffffff;
      font-size: 12px;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.15s ease-in-out;
      margin-bottom: 8px;
    }
    .btn:hover {
      background-color: #4338ca;
    }
    .footer {
      font-size: 10px;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">NEXUS Platform</div>
  <div class="title">Contextual Intelligence</div>
  <div class="status-card">
    <div class="status-row">
      <span class="label">Extension Status:</span>
      <span class="value" id="ext-status">READY</span>
    </div>
    <div class="status-row">
      <span class="label">Scanner Engine:</span>
      <span class="value" id="scanner-status">IDLE</span>
    </div>
  </div>
  <button class="btn" id="btn-activate">Scan Active Web Page</button>
  <div class="footer">Phase 2 — Read-Only Entity Detection Engine</div>
  <script type="module" src="popup.ts"></script>
</body>
</html>
